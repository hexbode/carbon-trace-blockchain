server:
  port: 8080

spring:
  application:
    name: carbon-trace-backend
  # 上传文件大小限制（头像等图片）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：请按本机实际 MySQL 账号密码修改下面的 username / password
    url: jdbc:mysql://localhost:3306/carbon_emission?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456   # 请按本机实际密码修改

mybatis-plus:
  configuration:
    # 数据库 snake_case 自动映射到 Java camelCase
    map-underscore-to-camel-case: true
    # 关闭 SQL 日志（需要调试可改为 org.apache.ibatis.logging.stdout.StdOutImpl）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      # 默认主键策略，各实体用 @TableId 覆盖
      id-type: auto

# 自定义配置
carbon:
  jwt:
    secret: carbon-trace-chain-2024-jwt-secret-key-please-change-0123456789abcdef
    expire-hours: 24
  # 上传文件保存目录（相对后端项目根目录），通过 /uploads/** 对外访问
  upload:
    dir: ./uploads
  # ============================================================
  # 区块链层：FISCO BCOS + WeBASE + Solidity 智能合约
  #
  # mode = webase：真实联盟链（SpringBoot 通过 WeBASE-Front REST 接口调用合约），生产/演示使用
  # mode = stub  ：离线开发桩，仅用于本机没有 WeBASE 时保证应用可启动、接口回归可跑，
  #                无区块、无挖矿、不落盘、重启即清空，不具备任何链特性
  #
  # 真实环境的地址与账户请通过环境变量或 application-local.yml（不入库）提供；
  # 任何配置都不得出现私钥（使用 WeBASE-Sign 时后端只持有 signUserId）。
  # ============================================================
  chain:
    mode: ${CARBON_CHAIN_MODE:stub}
    webase:
      base-url: ${CARBON_WEBASE_URL:http://127.0.0.1:5002}
      context-path: /WeBASE-Front
      # WeBASE 1.5.x（FISCO BCOS 2.x）为 1；WeBASE 3.x（FISCO BCOS 3.x）为 group0
      group-id: ${CARBON_CHAIN_GROUP_ID:group0}
      # 生产：WeBASE-Sign 托管用户（私钥不出 Sign 服务）
      sign-user-id: ${CARBON_CHAIN_SIGN_USER_ID:}
      # 本地开发：WeBASE-Front 本地私钥用户地址
      user-address: ${CARBON_CHAIN_USER_ADDRESS:}
      timeout-ms: 15000
    contracts:
      registry:
        name: CarbonCertRegistry
        address: ${CARBON_CHAIN_REGISTRY_ADDRESS:}
        abi-location: classpath:chain/CarbonCertRegistry.abi.json
      compliance:
        name: CarbonCompliance
        address: ${CARBON_CHAIN_COMPLIANCE_ADDRESS:}
        abi-location: classpath:chain/CarbonCompliance.abi.json
    # 区块浏览每页最多返回的区块数
    block-list-limit: 20
    # 链上存证与业务库的一致性对账间隔（毫秒）
    integrity-interval-ms: 300000
    compliance:
      # 链不可用时是否回退到本地 Java 规则，保证填报流程不中断
      fallback-to-java: true
    migration:
      # 历史数据上链一次性开关（旧自实现链 → 合约），默认关闭
      enabled: false
      legacy-file: ./data/blockchain.json
